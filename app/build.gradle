plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// APK metadata has one source, independent of Git tags.
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('version.json'))

// Local subscription settings are excluded from Git; see iptv.properties.example.
def iptvConfigFile = rootProject.file('iptv.properties')
if (!iptvConfigFile.isFile()) {
    throw new GradleException('Missing iptv.properties. Copy iptv.properties.example and configure your subscription URLs.')
}
def iptvConfig = new Properties()
iptvConfigFile.withInputStream { iptvConfig.load(it) }
def subscriptionUrl = iptvConfig.getProperty('subscription.url', '').trim()
def epgUrl = iptvConfig.getProperty('epg.url', '').trim()
['subscription.url': subscriptionUrl, 'epg.url': epgUrl].each { key, value ->
    def uri = null
    try { uri = new URI(value) } catch (URISyntaxException ignored) { }
    if (!(uri?.scheme in ['http', 'https']) || !uri?.host) {
        throw new GradleException("Configure a valid HTTP/HTTPS URL for ${key} in iptv.properties.")
    }
}

android {
    namespace 'com.lizongying.mytv'
    compileSdk 34
    buildToolsVersion '36.0.0'

    viewBinding {
        enabled = true
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        debug {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.lizongying.mytv"
        minSdk 21
        targetSdk 33
        versionCode (appVersion.version_code as int)
        versionName appVersion.version_name
        buildConfigField 'String', 'SUBSCRIPTION_URL', groovy.json.JsonOutput.toJson(subscriptionUrl)
        buildConfigField 'String', 'EPG_URL', groovy.json.JsonOutput.toJson(epgUrl)

        // This block is different from the one you use to link Gradle
        // to your CMake or ndk-build script.
        externalNativeBuild {

            // For ndk-build, instead use the ndkBuild block.
            cmake {
                arguments "-DIS_SO_BUILD=${project.hasProperty('IS_SO_BUILD') ? project.IS_SO_BUILD : false}"

                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }

        // Similar to other properties in the defaultConfig block,
        // you can configure the ndk block for each product flavor
        // in your build configuration.
        ndk {
            // Specifies the ABI configurations of your native
            // libraries Gradle should build and package with your app.
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = 17
    }

    // Encapsulates your external native build configurations.
    externalNativeBuild {

        // Encapsulates your CMake build configurations.
        cmake {

            // Provides a relative path to your CMake build script.
            path = file("CMakeLists.txt")
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    def media3_version = "1.3.1"

    implementation "androidx.media3:media3-ui:$media3_version"

    // For media playback using ExoPlayer
    implementation "androidx.media3:media3-exoplayer:$media3_version"

    // For HLS playback support with ExoPlayer
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"

    // 21:2.11.0 17:2.6.4
    def retrofit2_version = "2.11.0"

    implementation 'com.google.protobuf:protobuf-kotlin:3.25.1'
    implementation "com.squareup.retrofit2:converter-gson:$retrofit2_version"
    implementation "com.squareup.retrofit2:converter-protobuf:$retrofit2_version"
    implementation "com.squareup.retrofit2:retrofit:$retrofit2_version"

    implementation 'androidx.leanback:leanback:1.2.0-alpha04'
    
    implementation 'com.github.bumptech.glide:glide:4.11.0'

    implementation 'androidx.core:core-ktx:1.13.0'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"

    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2"
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0-RC")

    implementation 'com.google.android.exoplayer:exoplayer-ui:2.13.3'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.13.3'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.13.3'
}
